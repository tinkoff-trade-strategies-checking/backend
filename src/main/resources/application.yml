spring:
  application:
    name: trainer-backend
  datasource:
    hikari:
      # такты плеера (lab.session.max-concurrent-ticks) держат соединения; запас оставляет их HTTP-запросам
      maximum-pool-size: 20
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

server:
  # Tomcat RemoteIpValve: IP клиента из X-Forwarded-For от Caddy (внутренняя сеть, INV-10); нужен ограничителю входа
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # X-Forwarded-For доверяем только Caddy из закреплённой подсети internal (deploy/docker-compose.yml, 172.28.0.0/24)
      internal-proxies: 172\.28\.0\.\d{1,3}
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        secure: true
        same-site: lax

identity:
  login-limit:
    max-failures-per-pair: 5
    max-failures-per-email: 50
    max-failures-per-ip: 20
    window: 5m

lab:
  session:
    # ручная сессия без подписчиков SSE дольше этого срока встаёт на паузу (decisions.md)
    disconnect-pause-after: 5s
    min-tick: 200ms
    heartbeat: 2s
    event-retention: 24h
    max-concurrent-ticks: 8
    max-concurrent-sends: 256
  simulation:
    threads: ${SIMULATION_RUN_THREADS:2}
    queue-capacity: ${SIMULATION_RUN_QUEUE:100}
    max-running-per-user: ${SIMULATION_MAX_RUNNING_PER_USER:3}
    max-queued-per-user: ${SIMULATION_MAX_QUEUED_PER_USER:20}
    progress-interval: 250ms
    heartbeat: 2s
    event-retention: 24h
    max-concurrent-sends: 256

analysis:
  report-build:
    threads: ${REPORT_BUILD_THREADS:2}
    queue: ${REPORT_BUILD_QUEUE:100}
    retry-interval: ${REPORT_BUILD_RETRY_INTERVAL:1m}

worker:
  address: ${WORKER_ADDRESS:localhost:50051}
  deadline: ${WORKER_DEADLINE:5s}
  run-deadline: ${WORKER_RUN_DEADLINE:10m}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
