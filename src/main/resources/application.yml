spring:
  application:
    name: trainer-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

server:
  # Tomcat RemoteIpValve: IP клиента из X-Forwarded-For от Caddy (внутренняя сеть, INV-10); нужен ограничителю входа
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        secure: true
        same-site: lax

identity:
  login-limit:
    max-failures-per-email: 5
    max-failures-per-ip: 20
    window: 5m

lab:
  session:
    # ручная сессия без подписчиков SSE дольше этого срока встаёт на паузу (decisions.md)
    disconnect-pause-after: 5s
    min-tick: 200ms
    heartbeat: 2s
    event-retention: 24h
    max-concurrent-ticks: 8
    max-concurrent-sends: 256

worker:
  address: ${WORKER_ADDRESS:localhost:50051}
  deadline: ${WORKER_DEADLINE:5s}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
