apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmalert
  namespace: trainer
  labels:
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
  namespace: trainer
  labels:
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
data:
  trainer-alerts.yml: |
    groups:
      - name: trainer-backend
        interval: 30s
        rules:
          - alert: BackendDown
            expr: up{job="backend"} == 0
            for: 1m
            labels:
              severity: critical
              service: backend
            annotations:
              summary: "Backend недоступен"
              description: "Инстанс {{ $labels.instance }} не отвечает на /actuator/prometheus более 1 минуты."

          - alert: BackendHighErrorRate
            expr: |
              (
                sum(rate(http_server_requests_seconds_count{job="backend",status=~"5.."}[5m]))
                /
                clamp_min(sum(rate(http_server_requests_seconds_count{job="backend"}[5m])), 1e-6)
              ) > 0.05
            for: 5m
            labels:
              severity: warning
              service: backend
            annotations:
              summary: "Высокая доля 5xx ответов backend (> 5%)"
              description: "Доля ошибок 5xx за последние 5 минут составила {{ $value | humanizePercentage }}."

          - alert: BackendHighLatencyP95
            expr: |
              histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="backend"}[5m]))) > 1.5
            for: 5m
            labels:
              severity: warning
              service: backend
            annotations:
              summary: "Высокая задержка HTTP p95 (> 1.5s)"
              description: "95-й перцентиль времени ответа backend: {{ $value }}s."

          - alert: BackendJvmHeapHigh
            expr: |
              (
                sum by (pod) (jvm_memory_used_bytes{area="heap",job="backend"})
                /
                clamp_min(sum by (pod) (jvm_memory_max_bytes{area="heap",job="backend"}), 1)
              ) > 0.85
            for: 10m
            labels:
              severity: warning
              service: backend
            annotations:
              summary: "Высокое потребление JVM Heap (> 85%)"
              description: "Под {{ $labels.pod }} использует {{ $value | humanizePercentage }} JVM heap."

      - name: trainer-datastores
        interval: 30s
        rules:
          - alert: PostgresDown
            expr: pg_up == 0
            for: 1m
            labels:
              severity: critical
              service: postgres
            annotations:
              summary: "PostgreSQL недоступен"
              description: "postgres_exporter сообщает о недоступности PostgreSQL более 1 минуты."

          - alert: ClickHouseDown
            expr: up{job="clickhouse"} == 0
            for: 1m
            labels:
              severity: critical
              service: clickhouse
            annotations:
              summary: "ClickHouse недоступен"
              description: "Метрики ClickHouse (:9363) недоступны более 1 минуты."

      - name: trainer-observability
        interval: 30s
        rules:
          - alert: ObservabilityComponentDown
            expr: up{job="observability"} == 0
            for: 2m
            labels:
              severity: warning
              service: observability
            annotations:
              summary: "Компонент наблюдаемости недоступен"
              description: "Цель {{ $labels.instance }} недоступна более 2 минут."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: trainer
  labels:
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: vmalert
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmalert
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: trainer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8880"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: vmalert
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.112.0
          imagePullPolicy: IfNotPresent
          args:
            - "--rule=/etc/vmalert/rules/*.yml"
            - "--datasource.url=http://victoriametrics:8428"
            - "--notifier.url=http://alertmanager:9093"
            - "--remoteWrite.url=http://victoriametrics:8428"
            - "--remoteRead.url=http://victoriametrics:8428"
            - "--external.url=https://vmalert.obs.trainer.example.com"
            - "--httpListenAddr=:8880"
          ports:
            - name: http
              containerPort: 8880
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert/rules
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  namespace: trainer
  labels:
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vmalert
  ports:
    - name: http
      port: 8880
      targetPort: http
      protocol: TCP
