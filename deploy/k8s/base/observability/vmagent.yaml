apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmagent
  namespace: trainer
  labels:
    app.kubernetes.io/name: vmagent
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trainer-vmagent
  labels:
    app.kubernetes.io/name: vmagent
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trainer-vmagent
  labels:
    app.kubernetes.io/name: vmagent
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trainer-vmagent
subjects:
  - kind: ServiceAccount
    name: vmagent
    namespace: trainer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmagent-config
  namespace: trainer
  labels:
    app.kubernetes.io/name: vmagent
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
data:
  scrape.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      external_labels:
        cluster: trainer-k8s

    scrape_configs:
      # Автообнаружение подов в namespace trainer по аннотациям prometheus.io/*
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - trainer
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: service

      # Явные статические таргеты для ключевых сервисов стека
      - job_name: backend
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["backend:8081"]
            labels:
              service: backend

      - job_name: postgres
        static_configs:
          - targets: ["postgres:9187"]
            labels:
              service: postgres

      - job_name: clickhouse
        static_configs:
          - targets: ["clickhouse:9363"]
            labels:
              service: clickhouse

      - job_name: observability
        static_configs:
          - targets:
              - "victoriametrics:8428"
              - "victorialogs:9428"
              - "vmalert:8880"
              - "alertmanager:9093"
              - "grafana:3000"
              - "127.0.0.1:8429"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmagent
  namespace: trainer
  labels:
    app.kubernetes.io/name: vmagent
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: vmagent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmagent
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: trainer
    spec:
      serviceAccountName: vmagent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmagent
          image: victoriametrics/vmagent:v1.112.0
          imagePullPolicy: IfNotPresent
          args:
            - "--promscrape.config=/etc/vmagent/scrape.yml"
            - "--remoteWrite.url=http://victoriametrics:8428/api/v1/write"
            - "--remoteWrite.tmpDataPath=/tmp/vmagent-remotewrite-data"
            - "--httpListenAddr=:8429"
          ports:
            - name: http
              containerPort: 8429
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/vmagent
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: vmagent-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vmagent
  namespace: trainer
  labels:
    app.kubernetes.io/name: vmagent
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vmagent
  ports:
    - name: http
      port: 8429
      targetPort: http
      protocol: TCP
