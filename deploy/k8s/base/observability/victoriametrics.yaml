apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoriametrics
  namespace: trainer
  labels:
    app.kubernetes.io/name: victoriametrics
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoriametrics
  namespace: trainer
  labels:
    app.kubernetes.io/name: victoriametrics
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
spec:
  serviceName: victoriametrics
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoriametrics
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: trainer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8428"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: victoriametrics
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: victoriametrics
          # Включает встроенный VMUI на http://victoriametrics:8428/vmui
          image: victoriametrics/victoria-metrics:v1.112.0
          imagePullPolicy: IfNotPresent
          args:
            - "--storageDataPath=/victoria-metrics-data"
            - "--httpListenAddr=:8428"
            - "--retentionPeriod=30d"
            - "--selfScrapeInterval=0s"
          ports:
            - name: http
              containerPort: 8428
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: vm-data
              mountPath: /victoria-metrics-data
  volumeClaimTemplates:
    - metadata:
        name: vm-data
        labels:
          app.kubernetes.io/name: victoriametrics
          app.kubernetes.io/part-of: trainer
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: trainer
  labels:
    app.kubernetes.io/name: victoriametrics
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: victoriametrics
  ports:
    - name: http
      port: 8428
      targetPort: http
      protocol: TCP
