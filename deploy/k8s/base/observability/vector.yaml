apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: trainer
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trainer-vector
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trainer-vector
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trainer-vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: trainer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: trainer
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
data:
  vector.yaml: |
    data_dir: /vector-data-dir

    api:
      enabled: true
      address: 0.0.0.0:8686

    sources:
      kubernetes_logs:
        type: kubernetes_logs
        extra_namespace_label_selector: "app.kubernetes.io/part-of=trainer"

      internal_metrics:
        type: internal_metrics

    transforms:
      parse_json:
        type: remap
        inputs:
          - kubernetes_logs
        source: |
          .service = .kubernetes.pod_labels."app.kubernetes.io/name" ?? .kubernetes.container_name
          .namespace = .kubernetes.pod_namespace
          .pod = .kubernetes.pod_name
          parsed, err = parse_json(.message)
          if err == null && is_object(parsed) {
            . = merge(., parsed)
          }

    sinks:
      victorialogs:
        type: http
        inputs:
          - parse_json
        uri: "http://victorialogs:9428/insert/jsonline?_stream_fields=namespace,service,pod&_msg_field=message&_time_field=timestamp"
        compression: gzip
        encoding:
          codec: json
        framing:
          method: newline_delimited
        healthcheck:
          enabled: false

      prometheus_exporter:
        type: prometheus_exporter
        inputs:
          - internal_metrics
        address: 0.0.0.0:9598
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: trainer
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: trainer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9598"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: vector
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vector
          image: timberio/vector:0.44.0-alpine
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/etc/vector/vector.yaml"
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: VECTOR_SELF_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VECTOR_SELF_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 9598
              protocol: TCP
            - name: api
              containerPort: 8686
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          securityContext:
            # Чтение /var/log/pods на узлах требует доступа к файлам CRI; привилегии минимизированы
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - DAC_READ_SEARCH
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: data
              mountPath: /vector-data-dir
            - name: var-log
              mountPath: /var/log
              readOnly: true
            - name: var-lib
              mountPath: /var/lib
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: data
          emptyDir: {}
        - name: var-log
          hostPath:
            path: /var/log
        - name: var-lib
          hostPath:
            path: /var/lib
---
apiVersion: v1
kind: Service
metadata:
  name: vector
  namespace: trainer
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vector
  ports:
    - name: metrics
      port: 9598
      targetPort: metrics
      protocol: TCP
