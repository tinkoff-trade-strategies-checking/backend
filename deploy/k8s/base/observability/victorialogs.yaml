apiVersion: v1
kind: ServiceAccount
metadata:
  name: victorialogs
  namespace: trainer
  labels:
    app.kubernetes.io/name: victorialogs
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victorialogs
  namespace: trainer
  labels:
    app.kubernetes.io/name: victorialogs
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
spec:
  serviceName: victorialogs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victorialogs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victorialogs
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: trainer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9428"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: victorialogs
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: victorialogs
          # Включает встроенный VLUI на http://victorialogs:9428/select/vmui/
          image: victoriametrics/victoria-logs:v1.15.0-victorialogs
          imagePullPolicy: IfNotPresent
          args:
            - "--storageDataPath=/victoria-logs-data"
            - "--httpListenAddr=:9428"
            - "--retentionPeriod=14d"
          ports:
            - name: http
              containerPort: 9428
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: vl-data
              mountPath: /victoria-logs-data
  volumeClaimTemplates:
    - metadata:
        name: vl-data
        labels:
          app.kubernetes.io/name: victorialogs
          app.kubernetes.io/part-of: trainer
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: victorialogs
  namespace: trainer
  labels:
    app.kubernetes.io/name: victorialogs
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: trainer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: victorialogs
  ports:
    - name: http
      port: 9428
      targetPort: http
      protocol: TCP
