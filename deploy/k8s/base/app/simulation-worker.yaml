apiVersion: v1
kind: ServiceAccount
metadata:
  name: simulation-worker
  namespace: trainer
  labels:
    app.kubernetes.io/name: simulation-worker
    app.kubernetes.io/part-of: trainer
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation-worker
  namespace: trainer
  labels:
    app.kubernetes.io/name: simulation-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: trainer
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: simulation-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simulation-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: trainer
    spec:
      serviceAccountName: simulation-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: simulation-worker
          image: ghcr.io/tinkoff-trade-strategies-checking/simulation-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
          env:
            - name: WORKER_ADDRESS
              value: "0.0.0.0:50051"
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trainer-db-credentials
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_URL
              value: "http://ttsc:$(CLICKHOUSE_PASSWORD)@clickhouse:8123/ttsc"
          startupProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: simulation-worker
  namespace: trainer
  labels:
    app.kubernetes.io/name: simulation-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: trainer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: simulation-worker
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: simulation-worker
  namespace: trainer
  labels:
    app.kubernetes.io/name: simulation-worker
    app.kubernetes.io/part-of: trainer
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: simulation-worker
