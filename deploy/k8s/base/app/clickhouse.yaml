apiVersion: v1
kind: ServiceAccount
metadata:
  name: clickhouse
  namespace: trainer
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: trainer
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-metrics-config
  namespace: trainer
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: trainer
data:
  prometheus.xml: |
    <clickhouse>
        <prometheus>
            <endpoint>/metrics</endpoint>
            <port>9363</port>
            <metrics>true</metrics>
            <events>true</events>
            <asynchronous_metrics>true</asynchronous_metrics>
            <errors>true</errors>
        </prometheus>
    </clickhouse>
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: trainer
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: analytics-db
    app.kubernetes.io/part-of: trainer
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/component: analytics-db
        app.kubernetes.io/part-of: trainer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9363"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: clickhouse
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.8-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
            - name: native
              containerPort: 9000
              protocol: TCP
            - name: metrics
              containerPort: 9363
              protocol: TCP
          env:
            - name: CLICKHOUSE_DB
              valueFrom:
                configMapKeyRef:
                  name: trainer-app-config
                  key: CLICKHOUSE_DB
            - name: CLICKHOUSE_USER
              valueFrom:
                configMapKeyRef:
                  name: trainer-app-config
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trainer-db-credentials
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              valueFrom:
                configMapKeyRef:
                  name: trainer-app-config
                  key: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
          startupProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
            - name: prometheus-config
              mountPath: /etc/clickhouse-server/config.d/prometheus.xml
              subPath: prometheus.xml
              readOnly: true
      volumes:
        - name: prometheus-config
          configMap:
            name: clickhouse-metrics-config
  volumeClaimTemplates:
    - metadata:
        name: clickhouse-data
        labels:
          app.kubernetes.io/name: clickhouse
          app.kubernetes.io/part-of: trainer
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: trainer
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: analytics-db
    app.kubernetes.io/part-of: trainer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
      protocol: TCP
    - name: native
      port: 9000
      targetPort: native
      protocol: TCP
    - name: metrics
      port: 9363
      targetPort: metrics
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clickhouse
  namespace: trainer
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: trainer
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
