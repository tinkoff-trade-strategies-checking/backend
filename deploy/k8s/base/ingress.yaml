# INV-10: единая внешняя точка входа по HTTPS.
# Принудительный редирект HTTP -> HTTPS, TLS через cert-manager.
# Внутренние сервисы (PostgreSQL, ClickHouse, simulation-worker, management :8081) наружу не публикуются.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trainer-ingress
  namespace: trainer
  labels:
    app.kubernetes.io/name: trainer-ingress
    app.kubernetes.io/part-of: trainer
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    # Поддержка SSE-потоков плеера и симуляций
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - trainer.example.com
      secretName: trainer-tls
  rules:
    - host: trainer.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
