# ВНИМАНИЕ: это шаблон секретов с заглушками (INV-7).
# НИКОГДА не коммитьте реальные пароли и токены в Git.
# В production замените этот файл на ExternalSecret (External Secrets Operator),
# SealedSecret (Bitnami Sealed Secrets) или SOPS-зашифрованный манифест.
#
# Пример для External Secrets Operator:
#   apiVersion: external-secrets.io/v1beta1
#   kind: ExternalSecret
#   metadata:
#     name: trainer-db-credentials
#     namespace: trainer
#   spec:
#     secretStoreRef:
#       name: vault-backend
#       kind: ClusterSecretStore
#     target:
#       name: trainer-db-credentials
#     data:
#       - secretKey: POSTGRES_PASSWORD
#         remoteRef:
#           key: trainer/prod/db
#           property: postgres_password
#       - secretKey: CLICKHOUSE_PASSWORD
#         remoteRef:
#           key: trainer/prod/db
#           property: clickhouse_password
apiVersion: v1
kind: Secret
metadata:
  name: trainer-db-credentials
  namespace: trainer
  labels:
    app.kubernetes.io/part-of: trainer
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_POSTGRES_PASSWORD"
  CLICKHOUSE_PASSWORD: "CHANGE_ME_CLICKHOUSE_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: trainer
  labels:
    app.kubernetes.io/part-of: trainer
    app.kubernetes.io/component: observability
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "CHANGE_ME_GRAFANA_ADMIN_PASSWORD"
