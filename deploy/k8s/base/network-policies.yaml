# INV-10: сетевая изоляция в namespace trainer по принципу default-deny + явные правила.
# 1. По умолчанию весь входящий и исходящий трафик запрещён.
# 2. Только Ingress-контроллер имеет доступ к frontend (:8080) и backend API (:8080), но НЕ к management (:8081).
# 3. Только backend имеет доступ к postgres (:5432), clickhouse (:8123) и simulation-worker (:50051).
# 4. Только simulation-worker (помимо backend) имеет доступ к clickhouse (:8123).
# 5. Только vmagent имеет доступ к портам метрик (:8081, :9187, :9363 и др.).
# 6. Только Ingress-контроллер / observability-шлюз имеет доступ к UI наблюдаемости.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: trainer
  labels:
    app.kubernetes.io/part-of: trainer
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Разрешаем DNS-запросы (CoreDNS / kube-dns) всем подам в namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: trainer
  labels:
    app.kubernetes.io/part-of: trainer
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Frontend: входящий трафик только от Ingress-контроллера
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  namespace: trainer
  labels:
    app.kubernetes.io/part-of: trainer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
# Backend: API (:8080) только от Ingress-контроллера; метрики (:8081) только от vmagent;
# исходящий трафик только к postgres, clickhouse и simulation-worker
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-traffic
  namespace: trainer
  labels:
    app.kubernetes.io/part-of: trainer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
      ports:
        - protocol: TCP
          port: 8123
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: simulation-worker
      ports:
        - protocol: TCP
          port: 50051
---
# Simulation Worker: gRPC (:50051) только от backend; исходящий трафик только к clickhouse (:8123)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-worker-traffic
  namespace: trainer
  labels:
    app.kubernetes.io/part-of: trainer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: simulation-worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      ports:
        - protocol: TCP
          port: 50051
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
      ports:
        - protocol: TCP
          port: 8123
---
# PostgreSQL: БД (:5432) только от backend; метрики postgres_exporter (:9187) только от vmagent
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress
  namespace: trainer
  labels:
    app.kubernetes.io/part-of: trainer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - protocol: TCP
          port: 9187
---
# ClickHouse: HTTP (:8123) только от backend и simulation-worker; метрики (:9363) только от vmagent
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-clickhouse-ingress
  namespace: trainer
  labels:
    app.kubernetes.io/part-of: trainer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: simulation-worker
      ports:
        - protocol: TCP
          port: 8123
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - protocol: TCP
          port: 9363
---
# VictoriaMetrics (включая VMUI :8428): запись от vmagent/vmalert, чтение от grafana/vmalert, UI от Ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-victoriametrics-ingress
  namespace: trainer
  labels:
    app.kubernetes.io/part-of: trainer
    app.kubernetes.io/component: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: victoriametrics
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmalert
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8428
---
# VictoriaLogs (включая VLUI :9428): запись от vector, чтение от grafana/vmagent, UI от Ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-victorialogs-ingress
  namespace: trainer
  labels:
    app.kubernetes.io/part-of: trainer
    app.kubernetes.io/component: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: victorialogs
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vector
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 9428
---
# vmagent: сбор метрик внутри namespace + Kubernetes API для service discovery + запись в VictoriaMetrics
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vmagent-traffic
  namespace: trainer
  labels:
    app.kubernetes.io/part-of: trainer
    app.kubernetes.io/component: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmagent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - protocol: TCP
          port: 8429
  egress:
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 9187
        - protocol: TCP
          port: 9363
        - protocol: TCP
          port: 8428
        - protocol: TCP
          port: 9428
        - protocol: TCP
          port: 8880
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 9598
    # Kubernetes API для kubernetes_sd_configs
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
# vmalert: UI (:8880) от Ingress и метрики от vmagent; запросы в VictoriaMetrics и отправка алертов в Alertmanager
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vmalert-traffic
  namespace: trainer
  labels:
    app.kubernetes.io/part-of: trainer
    app.kubernetes.io/component: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmalert
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - protocol: TCP
          port: 8880
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: victoriametrics
      ports:
        - protocol: TCP
          port: 8428
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 9093
---
# Alertmanager: алерты от vmalert, UI от Ingress и Grafana, метрики от vmagent
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-traffic
  namespace: trainer
  labels:
    app.kubernetes.io/part-of: trainer
    app.kubernetes.io/component: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmalert
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 9093
  egress:
    # Исходящие вебхуки/уведомления по HTTPS (Telegram/Slack/PagerDuty)
    - ports:
        - protocol: TCP
          port: 443
---
# Grafana: UI (:3000) только от Ingress, метрики от vmagent; запросы к VictoriaMetrics, VictoriaLogs, Alertmanager
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-traffic
  namespace: trainer
  labels:
    app.kubernetes.io/part-of: trainer
    app.kubernetes.io/component: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: victoriametrics
      ports:
        - protocol: TCP
          port: 8428
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: victorialogs
      ports:
        - protocol: TCP
          port: 9428
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 9093
---
# Vector DaemonSet: метрики (:9598) от vmagent; отправка логов в VictoriaLogs и метаданные из Kubernetes API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vector-traffic
  namespace: trainer
  labels:
    app.kubernetes.io/part-of: trainer
    app.kubernetes.io/component: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vector
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - protocol: TCP
          port: 9598
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: victorialogs
      ports:
        - protocol: TCP
          port: 9428
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
