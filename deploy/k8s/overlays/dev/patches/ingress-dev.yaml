apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trainer-ingress
  namespace: trainer
  annotations:
    cert-manager.io/cluster-issuer: "selfsigned-issuer"
spec:
  tls:
    - hosts:
        - trainer.local
      secretName: trainer-dev-tls
  rules:
    - host: trainer.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observability-ingress
  namespace: trainer
  annotations:
    cert-manager.io/cluster-issuer: "selfsigned-issuer"
spec:
  tls:
    - hosts:
        - grafana.obs.trainer.local
        - vmui.obs.trainer.local
        - vlui.obs.trainer.local
        - alertmanager.obs.trainer.local
        - vmalert.obs.trainer.local
      secretName: observability-dev-tls
  rules:
    - host: grafana.obs.trainer.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
    - host: vmui.obs.trainer.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: victoriametrics
                port:
                  name: http
    - host: vlui.obs.trainer.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: victorialogs
                port:
                  name: http
    - host: alertmanager.obs.trainer.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alertmanager
                port:
                  name: http
    - host: vmalert.obs.trainer.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vmalert
                port:
                  name: http
