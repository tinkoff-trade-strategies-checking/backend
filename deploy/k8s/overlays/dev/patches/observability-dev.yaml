apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoriametrics
  namespace: trainer
spec:
  template:
    spec:
      containers:
        - name: victoriametrics
          args:
            - "--storageDataPath=/victoria-metrics-data"
            - "--httpListenAddr=:8428"
            - "--retentionPeriod=7d"
            - "--selfScrapeInterval=0s"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: vm-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victorialogs
  namespace: trainer
spec:
  template:
    spec:
      containers:
        - name: victorialogs
          args:
            - "--storageDataPath=/victoria-logs-data"
            - "--httpListenAddr=:9428"
            - "--retentionPeriod=7d"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: vl-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: trainer
spec:
  template:
    spec:
      containers:
        - name: grafana
          env:
            - name: GF_SERVER_ROOT_URL
              value: "https://grafana.obs.trainer.local/"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: trainer
spec:
  resources:
    requests:
      storage: 1Gi
