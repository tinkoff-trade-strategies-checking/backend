apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/environment: prod
    includeSelectors: false

patches:
  - path: patches/app-prod.yaml
  - path: patches/ingress-prod.yaml
  - path: patches/observability-prod.yaml
