name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Проверка формата (Spotless)
        run: ./gradlew spotlessCheck --no-daemon

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка, ErrorProne и тесты
        run: ./gradlew build -x spotlessCheck --no-daemon

  # Копия proto должна совпадать с core/proto на main (контракт gRPC, backend#9).
  proto-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Сверка proto с core
        run: |
          base=https://raw.githubusercontent.com/tinkoff-trade-strategies-checking/core/main/proto
          status=0
          for f in simulation.proto common.proto; do
            curl -fsSL "$base/$f" -o "/tmp/$f"
            if ! diff -u "/tmp/$f" "proto/$f"; then
              echo "::error file=proto/$f::копия отличается от core/proto/$f на main"
              status=1
            fi
          done
          exit $status

  # Размер PR в режиме наблюдения: не падает, только предупреждение (home#29).
  pr-size:
    if: github.event_name == 'pull_request'
    uses: tinkoff-trade-strategies-checking/.github/.github/workflows/pr-size.yml@main

  # Контракт REST и SSE — источник для frontend (backend#8).
  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Линтер OpenAPI
        run: npx -y @redocly/cli@latest lint api/openapi.yaml

  # Ссылки invariants.md на тесты backend, core и frontend (home#29, documentation#62).
  invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: backend
      - uses: actions/checkout@v4
        with:
          repository: tinkoff-trade-strategies-checking/documentation
          path: documentation
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: tinkoff-trade-strategies-checking/core
          path: core
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: tinkoff-trade-strategies-checking/frontend
          path: frontend
          fetch-depth: 1
      - name: Проверка ссылок invariants.md
        run: python3 documentation/scripts/check-invariants.py --core core --frontend frontend --backend backend
