name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Проверка формата (Spotless)
        run: ./gradlew spotlessCheck --no-daemon

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка, ErrorProne и тесты
        run: ./gradlew build -x spotlessCheck --no-daemon

  # Размер PR в режиме наблюдения: не падает, только предупреждение (home#29).
  pr-size:
    if: github.event_name == 'pull_request'
    uses: tinkoff-trade-strategies-checking/.github/.github/workflows/pr-size.yml@main
